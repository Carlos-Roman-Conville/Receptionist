services:
  chat:
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: chat
    env_file: .env
    environment:
      DATABASE_URL: postgresql://receptionist:receptionist@postgres:5432/receptionist
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  voice:
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: voice
    env_file: .env
    environment:
      DATABASE_URL: postgresql://receptionist:receptionist@postgres:5432/receptionist
      VOICE_PUBLIC_WS_URL: wss://voice.crc-solutions.org
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  async:
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: async
    env_file: .env
    environment:
      DATABASE_URL: postgresql://receptionist:receptionist@postgres:5432/receptionist
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - chat
      - voice
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
